# Linked worktrees build without incremental and through sccache: `scripts/worktree.sh setup`
# writes this gitignored file there; the main checkout has none.
include = [{ path = "worktree.toml", optional = true }]

[env]
# sqlx::query! macros check SQL against the committed .sqlx/ data, so builds need no database.
# `make sqlx-prepare` refreshes it after SQL changes (needs a migrated database).
SQLX_OFFLINE = "true"
