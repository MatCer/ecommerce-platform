name: CI

# Static checks only. Every test suite (cargo test, vitest, Playwright e2e + axe, perf) runs
# on the developer machine through `pnpm verify-merge <PR#>`, which records a `local-verify`
# commit status on the PR head and merges. See docs/runbook.md ("Verify and merge").
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # A commit on main must come from a merged PR whose head passed `pnpm verify-merge`.
  # Nothing refuses a direct push server-side, so this makes one visible (red main).
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Require a merged, locally verified pull request behind this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Works for merge commits and squash/rebase merges alike.
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" \
                  --jq '[.[] | select(.merged_at != null)][0] // empty')"
          if [ -z "$pr" ]; then
            echo "::error::Commit $SHA did not arrive through a merged pull request."
            exit 1
          fi
          number="$(jq -r '.number' <<<"$pr")"
          head="$(jq -r '.head.sha' <<<"$pr")"
          # The combined status holds the latest state per context.
          state="$(gh api "repos/$REPO/commits/$head/status" \
                     --jq '[.statuses[] | select(.context == "local-verify")][0].state // "missing"')"
          if [ "$state" != "success" ]; then
            echo "::error::PR #$number head $head has local-verify=$state. Merge with 'pnpm verify-merge $number'."
            exit 1
          fi
          echo "::notice::Commit came from PR #$number; local-verify passed on $head."

  rust:
    name: Rust (fmt, clippy) + OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      # The workspace's debug build (clippy + the OpenAPI drift build) is large; drop
      # preinstalled SDKs this job never uses (~25 GB).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # SQLX_OFFLINE=true (.cargo/config.toml): query macros check against .sqlx/, no database.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Static and deterministic: committed OpenAPI snapshot + generated TS clients match the API.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI clients are up to date
        run: scripts/openapi-drift.sh

  ts:
    name: TypeScript (Biome, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
