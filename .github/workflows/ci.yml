name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, tests) + OpenAPI drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.54.0@sha256:0bf32debcbfa8ba4e418679025f4935884972171513c92f0584689ff994a61df
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: meili-local-master-key-0123456789
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
      # WP11: Stripe API stand-in for the Stripe adapter tests (same image as compose).
      stripe-mock:
        image: stripe/stripe-mock:v0.203.0
        ports: ["12111:12111"]
    env:
      DATABASE_URL: postgres://app_owner:app-owner-ci@localhost:5432/app_test
      STRIPE_MOCK_URL: http://localhost:12111
      # The .env.example keys (derived from the master key above), created like meili-init does.
      MEILI_URL: http://localhost:7700
      MEILI_SEARCH_KEY: 2245a27fd200f741b246ce0479586838d71d3f5925e973144596c1ed10e3d918
      MEILI_ADMIN_KEY: 39acad57a641ce3bb328074fcae83ae01e5cc0edbb28c2ae113d3c6b246901f6
    steps:
      # The workspace's debug build (clippy + every integration test binary + the OpenAPI
      # drift build) outgrew the runner's free disk ("No space left on device"). Drop
      # preinstalled SDKs this job never uses (~25 GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Typst (invoice PDF render test, WP12)
        run: |
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - name: Create database roles (same script as docker compose)
        run: bash docker/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          APP_OWNER_PASSWORD: app-owner-ci
          APP_RUNTIME_PASSWORD: app-runtime-ci
          AUTH_DB_PASSWORD: auth-service-ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Search tests against Meilisearch (make test-search)
        run: |
          key() {
            curl -fsS -X POST "$MEILI_URL/keys" -H 'Authorization: Bearer meili-local-master-key-0123456789' \
              -H 'Content-Type: application/json' \
              --data "{\"uid\":\"$1\",\"name\":\"$2\",\"actions\":$3,\"indexes\":$4,\"expiresAt\":null}" >/dev/null
          }
          key 4b3c2a10-6f1e-4d0a-9b7e-5c1f2e3d4a01 api-search '["search"]' '["t_*"]'
          key 4b3c2a10-6f1e-4d0a-9b7e-5c1f2e3d4a02 worker-admin '["documents.*","indexes.*","settings.*","tasks.get"]' '["*"]'
          cargo test --workspace --locked -- --ignored
      # Drift check lives here to reuse the compiled workspace.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI clients are up to date
        run: scripts/openapi-drift.sh

  images:
    name: Container images (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Rust image (api + worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/rust.Dockerfile
          tags: ecommerce-rust:ci
          load: true
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - name: Build mocks image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/mocks/Dockerfile
          tags: ecommerce-mocks:ci
          load: true
          cache-from: type=gha,scope=mocks
          cache-to: type=gha,scope=mocks,mode=max
      - name: Build auth image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth/Dockerfile
          tags: ecommerce-auth:ci
          load: true
          cache-from: type=gha,scope=auth
          cache-to: type=gha,scope=auth,mode=max
      - name: Build admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          tags: ecommerce-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
      # WP23: the theme builder / sandbox image (locked theme deps + Chromium).
      - name: Build theme-builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/theme-builder/Dockerfile
          tags: ecommerce-theme-builder:ci
          load: true
          cache-from: type=gha,scope=theme-builder
          cache-to: type=gha,scope=theme-builder,mode=max
      - run: scripts/smoke-images.sh ecommerce-rust:ci ecommerce-mocks:ci ecommerce-theme-builder:ci ecommerce-auth:ci

  ts:
    name: TypeScript (Biome, typecheck, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

  acceptance:
    name: M1 browser, accessibility and performance
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "6"
      COMPOSE_PROJECT_NAME: acceptance
    steps:
      - name: Free disk space for the full stack
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/e2e exec playwright install --with-deps chromium
      - name: Isolate Compose networks
        run: |
          cp .env.example .env
          sed -i 's/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=acceptance/' .env
          cat > docker-compose.override.yml <<'EOF'
          networks:
            default:
              ipam:
                config:
                  - subnet: 10.213.15.0/24
            theme-check:
              ipam:
                config:
                  - subnet: 10.213.115.0/24
          EOF
      - run: make up
      - run: make seed
      - run: make perf
      - run: make e2e
      - name: Capture Compose logs
        if: always()
        run: docker compose -p acceptance logs --no-color --tail=200 > acceptance-compose.log 2>&1 || true
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            e2e/test-results/
            e2e/playwright-report/
            test-results/
            playwright-report/
            .perf/
            acceptance-compose.log
          if-no-files-found: ignore
      - name: Stop acceptance stack
        if: always()
        run: docker compose -p acceptance down -v
