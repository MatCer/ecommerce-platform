name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, tests) + OpenAPI drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://app_owner:app-owner-ci@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create database roles (same script as docker compose)
        run: bash docker/postgres/init-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          APP_OWNER_PASSWORD: app-owner-ci
          APP_RUNTIME_PASSWORD: app-runtime-ci
          AUTH_DB_PASSWORD: auth-service-ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Drift check lives here to reuse the compiled workspace.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI clients are up to date
        run: scripts/openapi-drift.sh

  images:
    name: Container images (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Rust image (api + worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/rust.Dockerfile
          tags: ecommerce-rust:ci
          load: true
          cache-from: type=gha,scope=rust
          cache-to: type=gha,scope=rust,mode=max
      - name: Build mocks image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/mocks/Dockerfile
          tags: ecommerce-mocks:ci
          load: true
          cache-from: type=gha,scope=mocks
          cache-to: type=gha,scope=mocks,mode=max
      # Built only: the auth service needs Postgres to start (it migrates its schema).
      - name: Build auth image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth/Dockerfile
          tags: ecommerce-auth:ci
          cache-from: type=gha,scope=auth
          cache-to: type=gha,scope=auth,mode=max
      - name: Build admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          tags: ecommerce-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
      - run: scripts/smoke-images.sh ecommerce-rust:ci ecommerce-mocks:ci

  ts:
    name: TypeScript (Biome, typecheck, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
