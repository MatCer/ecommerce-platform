[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
commerce = { path = "crates/commerce" }
platform = { path = "crates/platform" }
testkit = { path = "crates/testkit" }

ammonia = "4.2.0"
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rand = "0.10.3"
sha2 = "0.11.0"
axum = "0.8.9"
http-body-util = "0.1.5"
# Image pipeline (commerce::media): pure-Rust decoders, JPEG/PNG encoders.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.22.0"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "json", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "request-id", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
# AVIF encoder (pure Rust, rav1e); `image` only wraps it.
ravif = { version = "0.13.0", default-features = false }
# Lossy WebP (libwebp); `image` only encodes lossless WebP.
webp = { version = "0.3.1", default-features = false }
proptest = "1.11.0"
# WP13a: streaming feed parser (Heureka, Google Merchant); already in the tree via object_store.
quick-xml = "0.41.0"
# WP9: customer passwords (argon2id, OWASP parameters).
argon2 = "0.6.0"
# WP9 mail core: SMTP (Mailpit locally), MJML templates, template variables.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
minijinja = "2.24.0"
# WP14: webhook/ad-platform secrets at rest (AES-256-GCM), Storefront API rate limits (GCRA),
# Prometheus metrics (facade + text exporter, no built-in HTTP listener).
aes-gcm = "0.11.1"
governor = "0.10.4"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mrml = { version = "6.0.1", default-features = false, features = ["parse", "render"] }
# WP11 bank-transfer QR codes: QR matrix + SVG, CRC32 (already in the tree through png).
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
crc32fast = "1.5.0"
# WP23 theme source archives (A6): tar.gz read/write; flate2 and regex are already in the tree.
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
regex = "1.13.1"
base64 = "0.23.1"
# WP24 unified diffs of theme sources (AI runs, revision diff view).
similar = "3.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# Smaller debug artifacts: several agent worktrees build in parallel on one disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
